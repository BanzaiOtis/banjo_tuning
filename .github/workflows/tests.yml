# Runs the app's logic tests on GitHub every time code is pushed.
# Results show as a ✓ or ✗ next to each commit, and under the "Actions" tab.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        # The tests only use Python's standard library, so nothing needs installing.
        run: |
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t"
          done
